[build-system]
requires = [
    "mypy[mypyc]>=1.20.2",
    "setuptools",

    # This is for the build system, only used for mypyc linkage.
    #   Below versions in [project] are what will be installed and used with this project at runtime
    # TODO: Sympy began adding mypy type-hints and removed the py.typed file.
    #   It is actively being worked on, see https://github.com/sympy/sympy/issues/17945
    "sympy<=1.12.1",
]

[project]
name = "quadint"
version = "0.2.0"
dynamic = ["license"]
authors = [
  { name="Ryan Heard", email="ryanwheard@gmail.com" },
]
description = "A quadint class, for using quadratic integers."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]
keywords = ["complex", "math", "eisenstein"]
dependencies = [
    # TODO: Sympy began adding mypy type-hints and removed the py.typed file.
    #   It is actively being worked on, see https://github.com/sympy/sympy/issues/17945
    "sympy<=1.12.1",
]

[project.optional-dependencies]
test = [
    "mypy[mypyc]>=1.20.2",
    "setuptools",
    "pytest-xdist",
    "ruff",
    "pylint",
]

[project.urls]
Repository = "https://github.com/rheard/quadint"

[tool.cibuildwheel]
# TODO: Android, iOS?
build = "cp3{10,11,12,13,14}-{win,macosx,manylinux}*"

before-test = [
    'mkdir "{project}/temp"',
    'mv "{project}/quadint" "{project}/temp/quadint"',  # Move the .py files away so they are not used in testing
]
test-requires=["pytest", "pytest-xdist", "pylint"]
test-command=[
    "python -m pytest -n auto {project}/tests",

    # Require docstrings on all unit tests!
    'python -m pylint {project}/tests --disable=all --enable=C0115,C0116 --no-docstring-rgx="^(?!(test_|Test)).*"',
    'mv "{project}/temp/quadint" "{project}/quadint"',  # Move the .py files back so they are ready for the next build
    'rm -rf "{project}/temp"',
]
environment-pass = ["CI", "GITHUB_ACTIONS"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
extend-exclude=["quadint-stubs"]
exclude = [".venv", "*.pyi"]

[tool.ruff.lint]
preview = true
extend-select = [
    "A",      # flake8-builtins
    "ANN",    # flake8-annotations
    "ARG",    # flake8-unused-arguments
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "C4",     # flake8-comprehensions
    "COM",    # flake8-commas
    "DOC",    # lint.pydoclint
    "D",      # lint.pydocstyle
    "multi-line-summary-second-line",   # Require multi-line docstring summary should start on second line, which is not Google convention
    "E", "W", # pycodestyle
    # "ERA",    # eradicate    TODO: I'd like to enable this. Problem is, see the wishful thinking tests in test_basic
    "F",      # Pyflakes
    "FBT",    # flake8-boolean-trap
    "FLY",    # flynt
    "FURB",   # refurb
    "G",      # flake8-logging-format
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "ISC",    # flake8-implicit-str-concat
    "LOG",    # flake8-logging
    "NPY",    # Numpy-specific rules
    "PD",     # pandas-vet
    "PERF",   # Perflint
    "PIE",    # flake8-pie
    "PLC",    # Pylint
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "PYI",    # flake8-pyi
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "RUF",    # Ruff-specific rules
    "SIM",    # flake8-simplify
    "SLOT",   # flake8-slots
    "T20",    # flake8-print
    "TC",     # flake8-type-checking
    "TRY",    # tryceratops
    "UP",     # pyupgrade
    "YTT",    # flake8-2020
]
ignore=[
    "missing-return-type-undocumented-public-function",  # Missing return type
    # These next 2 mess with mypyc
    "missing-return-type-private-function",  # Missing return type annotation for private function
    "missing-return-type-special-method",  # Missing return type annotation for special method
    "cached-instance-method",  # Use of `functools.lru_cache` or `functools.cache` on methods can lead to memory leaks (duh, but I'm careful and we're slow ;) )
    "undocumented-public-module",    # Missing docstring in public module
    "undocumented-public-package",    # Missing docstring in public package
    "undocumented-magic-method",    # Missing docstring in magic method
    "blank-line-after-function",    # Blank line after function docstring
    "missing-blank-line-after-summary",   # Missing blank line after summary
    "multi-line-summary-first-line",    # Multi-line docstring summary should start at the first line
    "missing-terminal-punctuation",    # Closing punctuation on docstrings
    "property-docstring-starts-with-verb", # Property docstring should not start with a verb
    "pytest-incorrect-pytest-import",   # Incorrect import of pytest
    "redundant-numeric-union",
    "unsorted-dunder-slots",  # __slots__ is not sorted
    "non-empty-init-module",  # `__init__` module should only contain docstrings and re-exports
    "raise-vanilla-args",  # Avoid specifying long messages outside the exception class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true
suppress-none-returning = true

[tool.ruff.lint.flake8-import-conventions.aliases]
"matplotlib.pyplot" = "plt"
numpy = "np"
pandas = "pd"
subprocess = "sp"
datetime = "dt"

[tool.ruff.lint.isort]
force-wrap-aliases = true
combine-as-imports = true
lines-between-types = 1
known-first-party = ["quadint"]
